# Retrieval evaluation set (WBS 1.2 / 6.1).
# question: what the customer asks (DE or EN). query: the German search query ChatGPT is asked to send.
# expected: chunk ids that answer the question (a hit on any of them counts); [] = out of scope.
# reject_by (out of scope only): "search" = must come back as "no_relevant_passage" (unrelated topics);
# "model" = other insurance products on topics the documents do cover (e.g. cancelling a contract). Search
# can't tell those apart by similarity; ChatGPT must decline them using list_documents and the rules.
# Run: python -m insurance_gpt.retrieval.evaluate
#
# Shorthands below: U = ergo-zahntarife-uebersicht-2024-08:uebersicht, B = ergo-zahn-broschuere-2022-07:broschuere
# (expanded by the loader).
questions:
  - id: implants-ds90-de
    question: "Zahlt Dental-Schutz 90 für Implantate?"
    query: "Dental-Schutz 90 Implantate Erstattung"
    expected: [B:t9.r2, U:t2.r2, B:t5.r2]
  - id: implants-zez-en
    question: "Does Zahnersatz Sofort cover implants?"
    query: "Zahnersatz Sofort ZEZ Implantate"
    expected: [B:t12.r2]
  - id: waiting-period-en
    question: "Is there a waiting period before I can claim?"
