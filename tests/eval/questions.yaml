# Retrieval evaluation set (WBS 1.2 / 6.1).
# question: what the customer asks (DE or EN). query: the German search query ChatGPT is asked to send.
# expected: chunk ids that answer the question (a hit on any of them counts); [] = out of scope.
# reject_by (out of scope only): "search" = must come back as "no_relevant_passage" (unrelated topics);
# "model" = other insurance products on topics the documents do cover (e.g. cancelling a contract). Search
# can't tell those apart by similarity; ChatGPT must decline them using list_documents and the skill.
# Run: python -m insurance_gpt.retrieval.evaluate
questions:
  - id: implants-de
    question: "Zahlt der Tarif ZEK für Implantate?"
    query: "Implantate Leistung Ausschluss Tarif ZEK"
    expected: [ergo-zek-2025-04:avb:1.2, ergo-zek-2025-04:ipid:h04]
  - id: implants-en
    question: "Does my ZEK dental insurance pay for implants?"
    query: "Implantate Kostenübernahme Zahnersatz"
    expected: [ergo-zek-2025-04:avb:1.2, ergo-zek-2025-04:ipid:h04, ergo-zek-2025-04:ipid:h03]
  - id: first-year-limit-de
    question: "Wie viel zahlt die Versicherung im ersten Jahr maximal?"
    query: "Leistungsbegrenzung erstes Versicherungsjahr Höchstbetrag"
    expected: [ergo-zek-2025-04:avb:1.1#5, ergo-zek-2025-04:ipid:h05]
  - id: first-year-limit-en
    question: "Is there a maximum payout in the first two years?"
    query: "Leistungsbegrenzung ersten zwei Versicherungsjahre maximale Gesamtleistung"
