[project]
name = "insurance-gpt"
version = "0.1.0"
description = "ChatGPT plugin (MCP server) answering questions about ERGO insurance terms with verified citations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Heavy dependencies for the offline ingestion pipeline and retrieval (WBS 2.2 / 3.3).
rag = [
    "fastembed>=0.4",
    "httpx>=0.27",
    "pymupdf>=1.25",
    "qdrant-client>=1.12",
]

[project.scripts]
insurance-gpt = "insurance_gpt.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_gpt"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
